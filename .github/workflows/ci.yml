name: Проверка расширения

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Запустить тесты
        run: npm test

      - name: Проверить типы
        run: npm run typecheck

      - name: Собрать расширение
        run: npm run build

      - name: Проверить комплектность сборки
        run: npm run smoke
